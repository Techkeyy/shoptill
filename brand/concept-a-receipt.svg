<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- A: "Receipt" — the glasses print a receipt. Hands-free till. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1446"/>
      <stop offset="0.55" stop-color="#0d2a5c"/>
      <stop offset="1" stop-color="#03455e"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f1ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- light rays -->
  <g opacity="0.08" fill="#fff">
    <path d="M512 330 L120 0 H330 Z"/><path d="M512 330 L700 0 H904 Z"/><path d="M512 330 L1024 210 V420 Z"/><path d="M512 330 L0 260 V470 Z"/>
  </g>
  <!-- receipt coming out of the bridge -->
  <g filter="url(#shadow)">
    <path d="M402 360 H622 V800 L600 822 L578 800 L556 822 L534 800 L512 822 L490 800 L468 822 L446 800 L424 822 L402 800 Z" fill="url(#paper)"/>
    <rect x="436" y="455" width="152" height="18" rx="9" fill="#c9d6ee"/>
    <rect x="436" y="495" width="110" height="18" rx="9" fill="#c9d6ee"/>
    <rect x="436" y="535" width="132" height="18" rx="9" fill="#c9d6ee"/>
    <path d="M436 590 H588" stroke="#c9d6ee" stroke-width="6" stroke-dasharray="12 10"/>
    <!-- PAID stamp -->
    <g transform="rotate(-8 512 690)">
      <rect x="430" y="640" width="164" height="96" rx="20" fill="none" stroke="#18c964" stroke-width="12"/>
      <path d="M462 690 L498 722 L562 656" fill="none" stroke="#18c964" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- glasses -->
  <g filter="url(#shadow)">
    <path d="M150 300 Q512 250 874 300" fill="none" stroke="#0b0f1e" stroke-width="10" opacity="0"/>
    <rect x="128" y="262" width="330" height="200" rx="90" fill="#0b1020" stroke="#ffffff" stroke-width="34"/>
    <rect x="566" y="262" width="330" height="200" rx="90" fill="#0b1020" stroke="#ffffff" stroke-width="34"/>
    <path d="M458 330 Q512 296 566 330" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
    <path d="M128 318 L72 296" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
    <path d="M896 318 L952 296" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
  </g>
  <!-- HUD in the lenses -->
  <g filter="url(#glow)" fill="none" stroke="#3dff8a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M206 342 H330" stroke-width="22"/>
    <path d="M206 392 H290" stroke-width="22" opacity="0.6"/>
    <path d="M660 366 L712 412 L800 318" stroke-width="34"/>
  </g>
  <!-- the slot the receipt comes from -->
  <rect x="392" y="346" width="240" height="22" rx="11" fill="#0b1020"/>
</svg>
