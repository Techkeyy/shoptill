<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ShopTill</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #111);
    }
    #app { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; align-items: stretch; }
    .shop { font-size: 18px; color: var(--tg-theme-hint-color, #666); }
    .amount { font-size: 52px; font-weight: 700; line-height: 1.1; word-break: break-word; }
    .asset { font-size: 24px; font-weight: 600; }
    .note { font-size: 15px; color: var(--tg-theme-hint-color, #666); min-height: 20px; }
    .err { color: #d33; font-size: 16px; font-weight: 600; }
    button.main {
      width: 100%; padding: 16px; font-size: 18px; font-weight: 600; border: 0; border-radius: 12px;
      background: var(--tg-theme-button-color, #0088cc); color: var(--tg-theme-button-text-color, #fff);
    }
    button.main:disabled { opacity: .5; }
    .result { font-size: 40px; font-weight: 700; }
    .ok { color: #1a9e4a; } .bad { color: #d33; } .warn { color: #c77700; }
    .spin { width: 28px; height: 28px; margin: 0 auto; border-radius: 50%; border: 4px solid var(--tg-theme-hint-color, #999); border-top-color: transparent; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"><div class="spin"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
